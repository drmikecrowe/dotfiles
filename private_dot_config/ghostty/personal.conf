# Personal ghostty settings, layered on top of ~/.config/ghostty/config.
# Anything Omarchy owns (theme, cursor, async-backend, CSI-u and resize keybinds)
# stays in the base file — do not duplicate it here.

# ── Font ──────────────────────────────────────────────────────────────────────
# font-family and font-size live in the base config (Omarchy default + local tweak)
font-feature = +liga

# Fixed sizes for switching by screen resolution (ctrl+0 resets to font-size above)
keybind = ctrl+shift+1=set_font_size:10
keybind = ctrl+shift+2=set_font_size:12
keybind = ctrl+shift+3=set_font_size:14

# ── Window ────────────────────────────────────────────────────────────────────
window-save-state = always

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback-limit = 10000000

# ── Quick Terminal ────────────────────────────────────────────────────────────
# The global: binding this used to carry needs the XDG global-shortcuts portal,
# which is a KDE path. On Hyprland, bind it in ~/.config/hypr/bindings.lua instead:
#   o.bind("SUPER + GRAVE", "Quick terminal", "ghostty +new-window --quick-terminal")
quick-terminal-position = top
quick-terminal-animation-duration = 0.2
quick-terminal-autohide = true

# ── Keybinds — tmux-style ctrl+s leader ──────────────────────────────────────
keybind = ctrl+s>c=new_tab
keybind = ctrl+s>n=next_tab
keybind = ctrl+s>p=previous_tab
keybind = ctrl+s>\=new_split:right
keybind = ctrl+s>v=new_split:right
keybind = ctrl+s>s=new_split:down
keybind = ctrl+s>h=goto_split:left
keybind = ctrl+s>j=goto_split:bottom
keybind = ctrl+s>k=goto_split:top
keybind = ctrl+s>l=goto_split:right
keybind = ctrl+s>z=toggle_split_zoom
keybind = ctrl+s>r=reload_config

# ctrl+c copies only when a selection exists, otherwise sends SIGINT
keybind = performable:ctrl+c=copy_to_clipboard

# ── Mouse scrolling ───────────────────────────────────────────────────────────
# Override the Omarchy base's `mouse-scroll-multiplier = 0.95`. The bare form
# applies to BOTH axes, so discrete (wheel-notch) scrolling drops from its
# default of 3 lines to 0.95 — a wheel notch moves less than one line.
# Slow the precision (touchpad) axis only; leave discrete at the default.
mouse-scroll-multiplier = precision:0.95,discrete:3

# ── Quick terminal ───────────────────────────────────────────────────────────
# Native dropdown hosted by the single-instance daemon, so toggling is instant.
# Ghostty requests these from Hyprland directly, so bindings.lua must not bind them.
keybind = global:ctrl+shift+grave_accent=toggle_quick_terminal
# Open on the monitor under the mouse; the default `main` picks the laptop panel.
quick-terminal-screen = mouse
quick-terminal-autohide = true
# Keep the daemon alive when the last window closes. Otherwise the next launch
# races gtk-launch for the D-Bus name and the systemd unit fails (Result: protocol).
quit-after-last-window-closed = false
