# Merged config: personal settings (was ~/.tmux.conf) + Omarchy's defaults.
#
# Lives at the XDG path deliberately. tmux 3.x loads BOTH ~/.tmux.conf and
# $XDG_CONFIG_HOME/tmux/tmux.conf, XDG last, so keeping two files meant Omarchy
# silently overrode half the personal bindings (prefix k became kill-window).
# One file, XDG path, no shadowing.

# ── Prefix ────────────────────────────────────────────────────────────────────
# C-b stays primary (muscle memory); C-Space added so Omarchy's documented
# keys work too.
set -g prefix C-b
set -g prefix2 C-Space
bind -N "Send prefix" C-Space send-prefix

# ── Config and help ───────────────────────────────────────────────────────────
unbind r
bind -N "Reload configuration" r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Refresh client" R refresh-client
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"

# Extended keys enabled — mouse drag fixed via explicit begin-selection binding
set -g extended-keys on
set -g extended-keys-format csi-u

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off

set-option -g default-command $SHELL
set-option -g default-shell $SHELL

# ── Copy mode ─────────────────────────────────────────────────────────────────
set-window-option -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection

# Mouse drag: enter copy-mode with character-level selection
bind -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } "copy-mode -M ; send-keys -X begin-selection"

# Copy to Wayland clipboard (kept over Omarchy's copy-selection-and-cancel:
# the explicit wl-copy pipe survives detached/SSH sessions)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "wl-copy"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# ── Pane focus (prefix) — personal, wins over Omarchy's h/v split bindings ────
bind-key -N "Focus pane left"  h select-pane -L
bind-key -N "Focus pane down"  j select-pane -D
bind-key -N "Focus pane up"    k select-pane -U
bind-key -N "Focus pane right" l select-pane -R
bind -N "Kill pane" x kill-pane
bind-key -N "Split pane" - split-window

# ── Pane controls (root table, from Omarchy — no prefix, no collisions) ───────
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# ── Windows ───────────────────────────────────────────────────────────────────
# Omarchy's prefix r (rename) and k (kill-window) are NOT bound here: they
# collide with reload and pane-focus above. tmux defaults cover both —
# `prefix ,` renames, `prefix &` kills.
bind -N "Create window" c new-window -c "#{pane_current_path}"

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# clear screen
bind w send-keys -R \; clear-history

# ── Sessions ──────────────────────────────────────────────────────────────────
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

unbind C-s
bind-key C-s choose-tree -Zs

# Paired terminal as a split, instead of the session switch C-t does.
# Same pairing rule as C-t (aoe_term_<x>_<hash> <-> <x>_<hash>); the new pane
# starts in the twin's current directory. vim vocabulary: C-v side-by-side,
# C-h stacked. #{pane_id} is expanded by tmux and passed in, because an
# untargeted tmux command inside run-shell follows the current client rather
# than the pane the key was pressed in.
# Plain splits without the pairing are still % and " (tmux defaults) and `-`.
unbind C-v
bind-key C-v run-shell '/home/mcrowe/.local/bin/tmux-aoe-pair-split.sh -h "#{pane_id}"'
bind-key C-h run-shell '/home/mcrowe/.local/bin/tmux-aoe-pair-split.sh -v "#{pane_id}"'

# C-t: toggle the paired terminal as a right-hand split of the agent window
# (creates the terminal if missing; on a terminal session it switches back).
bind-key C-t run-shell '/home/mcrowe/.local/bin/tmux-aoe-term-toggle.sh "#{pane_id}"'
# Toggle Sessions (n)
bind-key n run-shell 'current=$(tmux display-message -p "#S"); hash=$(echo "$current" | sed "s/.*_//"); if echo "$current" | grep -q "^aoe_term_"; then target=$(tmux list-sessions -F "##{session_name}" | grep -v "^aoe_term_" | grep "_${hash}$" | head -1); else target=$(tmux list-sessions -F "##{session_name}" | grep "^aoe_term_.*_${hash}$" | head -1); fi; if [ -n "$target" ]; then tmux switch-client -t "$target"; else tmux display-message "No paired session for hash ${hash}"; fi'

# ── Window sizing ─────────────────────────────────────────────────────────────
# Window size is AUTOMATIC: every session is re-fitted to the acting client on
# attach, on session switch, on client resize, and on session create. Looping
# over list-sessions is needed because a detached session otherwise stays
# frozen at its last client's size, which `window-size latest` alone does not
# fix. Height subtracts the status line when it is on.
#
# History: c9ebdc4 replaced these hooks with `window-size manual` + prefix+F,
# on the theory that avoiding WIDTH changes would stop an inline-rendering TUI
# re-wrapping and replaying its transcript into scrollback. The measurement
# behind that (a 100->92 resize re-emitted 67 lines; a same-width resize is a
# no-op) still holds, but going manual did NOT stop omp replaying in practice,
# so the tradeoff bought nothing and cost a keypress on every font-size change.
# Reverted to 61b1d28's behaviour. The omp replay is a real, still-open problem
# and is being solved separately -- do not re-introduce `window-size manual`
# for it without re-testing that it actually helps.
#
# Unset, not just deleted: a reload must clear `window-size manual` out of a
# server that c9ebdc4 already set it on. Falls back to the tmux default.
set -gu window-size

set-hook -g client-attached        "run-shell \"tmux list-sessions -F '##{session_name}' | xargs -I{} tmux resize-window -t {} -x #{client_width} -y #{e|-:#{client_height},#{?status,1,0}}\""
set-hook -g client-resized         "run-shell \"tmux list-sessions -F '##{session_name}' | xargs -I{} tmux resize-window -t {} -x #{client_width} -y #{e|-:#{client_height},#{?status,1,0}}\""
set-hook -g client-session-changed "run-shell \"tmux list-sessions -F '##{session_name}' | xargs -I{} tmux resize-window -t {} -x #{client_width} -y #{e|-:#{client_height},#{?status,1,0}}\""
set-hook -g session-created[0]     "if -F '#{m:aoe_*,#{session_name}}' 'set detach-on-destroy on'"
set-hook -g session-created[1]     "run-shell \"tmux list-sessions -F '##{session_name}' | xargs -I{} tmux resize-window -t {} -x #{client_width} -y #{e|-:#{client_height},#{?status,1,0}}\""

# Manual re-fit override, kept as an escape hatch: prefix + F.
bind-key F run-shell "tmux list-sessions -F '##{session_name}' | xargs -I{} tmux resize-window -t {} -x #{client_width} -y #{e|-:#{client_height},#{?status,1,0}}" \; display 'Windows re-fitted to this client'

# ── Mouse toggles ─────────────────────────────────────────────────────────────
bind m \
    set -g mode-mouse on \;\
    set -g mouse-resize-pane on \;\
    set -g mouse-select-pane on \;\
    set -g mouse-select-window on \;\
    display 'Mouse: ON'

bind M \
    set -g mode-mouse off \;\
    set -g mouse-resize-pane off \;\
    set -g mouse-select-pane off \;\
    set -g mouse-select-window off \;\
    display 'Mouse: OFF'

# ── Status bar and theme (Omarchy) ────────────────────────────────────────────
# Palette-relative colours (blue/brightblack), so the bar follows
# `omarchy theme set` the same way ghostty and nvim do.
#
# This replaces the catppuccin/tmux plugin, which hardcoded a palette and would
# fight the theme switcher. To go back, re-add to the plugin list below:
#   set -g @plugin 'catppuccin/tmux'
# along with the @catppuccin_* settings (see git history of dot_tmux.conf).
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# ── Plugins (TPM) ─────────────────────────────────────────────────────────────
# TPM is not installed by chezmoi (.tmux/plugins is in .chezmoiignore).
# Bootstrap with:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then `prefix + I` inside tmux.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Keep this line at the very bottom of the plugin section
run '~/.tmux/plugins/tpm/tpm'

# ── Overrides that must come after TPM ────────────────────────────────────────
# Project-first session picker; aoe's own names sort every aoe_term_* away from
# the project it belongs to. S keeps the stock chooser.
bind-key s display-popup -E -w 70% -h 60% '~/.local/bin/tmux-aoe-picker.sh'
bind-key S choose-tree -Zs

# tmux-sensible turns this on; it fights the explicit resize-window hooks above
# and causes repeated SIGWINCH on session switch. Omarchy's default also sets
# it on, so this must stay last.
setw -g aggressive-resize off
